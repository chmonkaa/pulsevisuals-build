name: Build Pulse Visuals

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project archive
        run: unzip -o pulsevisuals-1.0.0-project.zip -d .

      - name: Fix Gradle plugin version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pulsevisuals/build.gradle")
          s = p.read_text()
          s = s.replace(
              'id \'fabric-loom\' version "${project.loom_version}"',
              'id \'fabric-loom\' version \'1.14-SNAPSHOT\''
          )
          p.write_text(s)
          PY

      - name: Build mod
        working-directory: pulsevisuals
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisuals-JAR
          path: |
            pulsevisuals/build/libs/*.jar
            !pulsevisuals/build/libs/*-sources.jar
          if-no-files-found: error
